# Task Template
# Save as: projects/[project-id]/tasks/TASK-XXX.yaml

task_id: TASK-XXX
feature_id: FEAT-XXX
epic_id: EPIC-XXX
project_id: [project-id]

# Basic Info
name: "[Task name - specific and actionable]"
type: implementation     # implementation | test | docs | refactor | bugfix
description: |
  Detailed description of what needs to be done.
  Can include implementation details, approach, or specific requirements.

# Status Tracking
# ⚠️ MUST be exactly: todo | in_progress | done
# ❌ NEVER use: completed, finished, closed, resolved
status: todo
progress: 0              # 0-100 percentage

# Relationships
dependencies:
  - TASK-XXX             # Other tasks that must complete first
  - FEAT-XXX             # Related features

# Acceptance Criteria
acceptance_criteria:
  - "Specific, verifiable criterion 1"
  - "Specific, verifiable criterion 2"
  - "Specific, verifiable criterion 3"

# Files
files_to_create:
  - path/to/new_file1.dart
  - path/to/new_file2.dart

files_to_modify:
  - path/to/existing_file1.dart
  - path/to/existing_file2.dart

# Code References
code_templates: |
  Optional code snippets or templates to use.
  Can be multi-line with code blocks.

# Testing Requirements
tests_required:
  - "Unit test: [specific test case]"
  - "Widget test: [specific test case]"
  - "Integration test: [specific test case]"

# Verification Steps
verification_steps:
  - "Step 1: [How to verify this task is complete]"
  - "Step 2: [Another verification step]"
  - "Step 3: [Final check]"

# Effort Estimation
estimated_hours: 2
actual_hours: 0          # Updated by AI when done

# Technical Notes
technical_notes: |
  Implementation details, patterns to follow, or technical constraints.

# Blockers
blockers:
  - blocker_id: ""
    description: ""
    status: ""

# Metadata
created: YYYY-MM-DDThh:mm:ssZ
updated: YYYY-MM-DDThh:mm:ssZ
created_by: AI

# Execution Log
execution_log:
  - timestamp: YYYY-MM-DDThh:mm:ssZ
    action: "created"
    by: AI
  - timestamp: YYYY-MM-DDThh:mm:ssZ
    action: "started"
    by: AI
  - timestamp: YYYY-MM-DDThh:mm:ssZ
    action: "completed"
    by: AI

# Notes
notes: |
  Additional context, decisions made, or issues encountered.
